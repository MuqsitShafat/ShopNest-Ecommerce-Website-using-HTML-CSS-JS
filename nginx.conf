server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /products/x -> /products/x/ (relative redirect so it works behind any proxy/domain)
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Images rarely change: cache for 30 days
    location ~* \.(webp|jpe?g|png|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    # CSS/JS are not fingerprinted: short cache so deploys show up quickly
    location ~* \.(css|js|json)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # sitemap.xml, robots.txt, llms.txt, llms-full.txt contain non-ASCII (Rs, —): serve as UTF-8
    charset utf-8;
    charset_types text/plain text/xml application/xml text/css application/javascript application/json;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
